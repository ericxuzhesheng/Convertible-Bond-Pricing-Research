name: Verify corrected pricing handoff

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - backtest/ZL_Model_Prices.csv
      - backtest/ZL_Model_Manifest.json
      - backtest/LSM_Model_Manifest.json
      - backtest/BS_Model_Manifest.json

permissions:
  contents: read

jobs:
  verify-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pricing dependencies
        run: python -m pip install pandas==2.3.3 numpy==2.2.6 scipy==1.16.3 numba==0.62.1 openpyxl==3.1.5
      - name: Validate all corrected pricing artifacts
        run: >-
          python -c "import sys; sys.path.insert(0, 'backtest');
          from pathlib import Path;
          from pricing_backtest import validate_outputs;
          from pricing_inputs import PricingInputs;
          data=PricingInputs(Path('backtest'));
          manifests=[validate_outputs(m,Path('backtest'),data) for m in ('BS','ZL','LSM')];
          assert len({m['input_cutoff'] for m in manifests}) == 1"
      # No historical factor or frozen strategy ledger is rebuilt by a pricing push.
