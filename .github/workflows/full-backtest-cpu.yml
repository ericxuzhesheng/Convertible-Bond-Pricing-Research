name: Complete weekly cloud update

on:
  workflow_dispatch:
  schedule:
    # Friday 17:30 Asia/Shanghai (09:30 UTC), after market data is ready.
    - cron: "30 9 * * 5"

permissions:
  contents: write

concurrency:
  group: weekly-cloud-update-main
  cancel-in-progress: false

env:
  TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
  PYTHONUNBUFFERED: "1"
  NUMBA_NUM_THREADS: "4"

jobs:
  update-main:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out main with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install production dependencies
        run: >-
          python -m pip install
          akshare==1.18.46
          tushare==1.4.29
          pandas==2.3.3
          numpy==2.2.6
          scipy==1.16.3
          numba==0.62.1
          numba-cuda==0.30.4
          matplotlib==3.10.6
          seaborn==0.13.2
          requests==2.32.5
          tqdm==4.67.1
          openpyxl==3.1.5
          pytest

      - name: Require the repository Tushare secret
        shell: bash
        run: |
          if [[ -z "${TUSHARE_TOKEN}" ]]; then
            echo "::error::Repository Actions secret TUSHARE_TOKEN is missing."
            exit 1
          fi

      - name: Verify execution contracts
        run: python -m pytest -q

      - name: Update weekly market-data caches incrementally
        run: python -u backtest/data_pipeline.py --weekly

      - name: Update Black-Scholes weekly results
        run: python -u backtest/B-S_backtest.py --weekly

      - name: Update ZL weekly results on CPU
        run: python -u backtest/Z-L_backtest_CPU_prod.py --weekly --offline-inputs

      - name: Resolve the latest completed weekly market date
        shell: bash
        run: |
          MARKET_END="$(
            python -c "import sys; sys.path.insert(0, 'backtest'); import pandas as pd; from market_data_contracts import select_completed_weekly_dates; idx=pd.to_datetime(pd.read_csv('backtest/cb_price_cache.csv', index_col=0).index); print(select_completed_weekly_dates(idx)[-1].strftime('%Y%m%d'))"
          )"
          echo "MARKET_END=${MARKET_END}" >> "${GITHUB_ENV}"

      - name: Update benchmark through the completed market week
        run: >-
          python -u
          "long-short strategy/update_benchmark.py"
          --end "${MARKET_END}"

      - name: Rebuild factors strategies and figures
        run: python -u backtest/rebuild_research_outputs.py

      - name: Validate complete cloud outputs
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          import pandas as pd

          root = Path("backtest")
          manifest = json.loads(
              (root / "ZL_Model_Manifest.json").read_text(encoding="utf-8")
          )
          summary = root / "ZL_Model_Summary.xlsx"
          actual_hash = hashlib.sha256(summary.read_bytes()).hexdigest()
          if manifest.get("output_sha256") != actual_hash:
              raise SystemExit("ZL summary hash does not match its manifest")
          if manifest.get("execution_backend") != "cpu":
              raise SystemExit("ZL cloud update did not use the CPU backend")

          model = pd.read_csv(
              root / "ZL_Model_Prices.csv",
              index_col=0,
              parse_dates=True,
          )
          market = pd.read_csv(
              root / "ZL_Market_Prices.csv",
              index_col=0,
              parse_dates=True,
          )
          if not model.index.equals(market.index):
              raise SystemExit("ZL model and market dates do not align")
          if model.index.max().date().isoformat() != manifest["input_cutoff"]:
              raise SystemExit("ZL manifest cutoff is not the latest model date")

      - name: Upload weekly outputs for recovery
        uses: actions/upload-artifact@v4
        with:
          name: weekly-cloud-results-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            backtest/cb_*_cache.csv
            backtest/cb_*_events.csv
            backtest/cb_amount_cache.csv
            backtest/cb_balance_cache.csv
            backtest/cb_rating_cache.csv
            backtest/cb_basic_info.csv
            backtest/cb_clause_terms.csv
            backtest/rf_yield_cache.csv
            backtest/bs_volatility_cache.csv
            backtest/BS_Model_*.csv
            backtest/BS_Model_Summary.xlsx
            backtest/ZL_Model_*.csv
            backtest/ZL_Model_Summary.xlsx
            backtest/ZL_Model_Manifest.json
            backtest/Market_Prices.csv
            backtest/Fig*.png
            long-short strategy/000832_CSI_close_price.csv

      - name: Commit and publish the complete weekly update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No weekly changes to publish."
          else
            git commit -m "chore: complete weekly cloud update $(date -u +%Y%m%d)"
            git push origin "HEAD:main"
          fi
