name: Strict incremental weekly cloud update

on:
  workflow_dispatch:
  schedule:
    # Friday 17:30 Asia/Shanghai (09:30 UTC), after market data is ready.
    - cron: "30 9 * * 5"

permissions:
  contents: write

concurrency:
  group: weekly-cloud-update-main
  cancel-in-progress: false

env:
  TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
  PYTHONUNBUFFERED: "1"
  NUMBA_NUM_THREADS: "4"

jobs:
  update-main:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out main for incremental publication
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install production dependencies
        run: >-
          python -m pip install
          akshare==1.18.46
          tushare==1.4.29
          pandas==2.3.3
          numpy==2.2.6
          scipy==1.16.3
          numba==0.62.1
          matplotlib==3.10.6
          seaborn==0.13.2
          requests==2.32.5
          tqdm==4.67.1
          openpyxl==3.1.5
          pytest

      - name: Install Chinese fonts for pricing figures
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Require the repository Tushare secret
        shell: bash
        run: |
          if [[ -z "${TUSHARE_TOKEN}" ]]; then
            echo "::error::Repository Actions secret TUSHARE_TOKEN is missing."
            exit 1
          fi

      - name: Verify execution contracts
        run: python -m pytest -q tests

      - name: Resolve the bounded incremental data start
        shell: bash
        run: |
          BOUNDS="$(python backtest/update_pricing_volatility.py --print-bounds)"
          read -r PIPELINE_START MODEL_CUTOFF <<< "${BOUNDS}"
          echo "PIPELINE_START=${PIPELINE_START}" >> "${GITHUB_ENV}"
          echo "MODEL_CUTOFF=${MODEL_CUTOFF}" >> "${GITHUB_ENV}"

      - name: Update weekly market-data caches incrementally
        run: >-
          python -u backtest/data_pipeline.py
          --start "${PIPELINE_START}"
          --weekly
          --reuse-clause-cache
          --reuse-conversion-event-cache

      - name: Refresh observed weekly volatility once for all models
        run: python -u backtest/update_pricing_volatility.py --after "${MODEL_CUTOFF}"

      - name: Update Black-Scholes weekly results
        run: python -u backtest/B-S_backtest.py --weekly --incremental-after "${MODEL_CUTOFF}"

      - name: Update ZL weekly results on CPU
        run: python -u backtest/Z-L_backtest_CPU_prod.py --weekly --offline-inputs

      - name: Update LSM weekly results incrementally
        run: python -u backtest/LSM_backtest.py --weekly

      - name: Refresh pricing figures without rebuilding research
        run: |
          python -u backtest/update_etf_benchmark.py
          python -u backtest/regenerate_plots.py --pricing-only

      - name: Resolve the latest completed weekly market date
        shell: bash
        run: |
          MARKET_END="$(
            python -c "import sys; sys.path.insert(0, 'backtest'); import pandas as pd; from market_data_contracts import select_completed_weekly_dates; idx=pd.to_datetime(pd.read_csv('backtest/cb_price_cache.csv', index_col=0).index); print(select_completed_weekly_dates(idx)[-1].strftime('%Y%m%d'))"
          )"
          echo "MARKET_END=${MARKET_END}" >> "${GITHUB_ENV}"

      - name: Update benchmark through the completed market week
        run: >-
          python -u
          "long-short strategy/update_benchmark.py"
          --end "${MARKET_END}"

      # Legacy IC manifests and frozen strategy ledgers retain their v1 pricing.
      # Resume research publication only after its separately reviewed migration.
      - name: Rebuild factors strategies and figures
        if: ${{ false }}
        run: python -u backtest/rebuild_research_outputs.py

      - name: Validate the incremental cloud outputs
        run: >-
          python -c "import sys; sys.path.insert(0, 'backtest');
          from pricing_backtest import validate_outputs;
          from pricing_inputs import PricingInputs;
          from pathlib import Path;
          data=PricingInputs(Path('backtest'));
          manifests=[validate_outputs(m, Path('backtest'),data) for m in ('BS','ZL','LSM')];
          assert len({m['input_cutoff'] for m in manifests}) == 1"

      - name: Upload weekly outputs for recovery
        uses: actions/upload-artifact@v4
        with:
          name: weekly-cloud-results-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            backtest/cb_*_cache.csv
            backtest/cb_*_events.csv
            backtest/cb_amount_cache.csv
            backtest/cb_balance_cache.csv
            backtest/cb_rating_cache.csv
            backtest/cb_basic_info.csv
            backtest/cb_clause_terms.csv
            backtest/rf_yield_cache.csv
            backtest/bs_volatility_cache.csv
            backtest/BS_Model_*.csv
            backtest/BS_Model_Summary.xlsx
            backtest/ZL_Model_*.csv
            backtest/ZL_Model_Summary.xlsx
            backtest/ZL_Model_Manifest.json
            backtest/LSM_Model_*.csv
            backtest/LSM_Model_Summary.xlsx
            backtest/LSM_Model_Manifest.json
            backtest/*_Monte_Carlo_SE.csv
            backtest/*_Implied_Credit_Spread.csv
            backtest/*_Pricing_Coverage.csv
            backtest/*_Pricing_Issues.csv
            backtest/BS_Model_Manifest.json
            backtest/Pricing_Migration.json
            backtest/ETF_511380_Daily.csv
            backtest/ETF_511380_Manifest.json
            backtest/Pricing_Metrics.csv
            backtest/Market_Prices.csv
            backtest/Fig*.png
            long-short strategy/000832_CSI_close_price.csv
            backtest/strategy_inputs/
            long-short strategy/weekly_results/
            long-short strategy/weekly_value_results/

      - name: Commit and publish the complete weekly update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add backtest/strategy_inputs "long-short strategy/weekly_results" "long-short strategy/weekly_value_results"
          if git diff --cached --quiet; then
            echo "No weekly changes to publish."
          else
            git commit -m "chore: complete weekly cloud update $(date -u +%Y%m%d)"
            git push origin "HEAD:main"
          fi
