name: Full-history real-data rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - codex/full-history-real-data-rebuild
    paths:
      - .github/workflows/full-history-data-rebuild.yml

permissions:
  contents: write

concurrency:
  group: full-history-real-data-rebuild
  cancel-in-progress: false

jobs:
  rebuild-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install data-pipeline dependencies
        run: >-
          python -m pip install
          akshare==1.18.46
          tushare==1.4.29
          pandas==2.3.3
          numpy==2.2.6
          scipy==1.16.3
          matplotlib==3.10.6
          requests==2.32.5
          tqdm==4.67.1
          openpyxl==3.1.5
          pytest

      - name: Require the repository Tushare secret
        shell: bash
        run: |
          if [[ -z "${TUSHARE_TOKEN}" ]]; then
            echo "::error::Repository Actions secret TUSHARE_TOKEN is not configured."
            exit 1
          fi

      - name: Restore an interrupted cb_daily checkpoint
        uses: actions/cache@v4
        with:
          path: backtest/.cb_daily_checkpoint
          key: cb-daily-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            cb-daily-${{ runner.os }}-${{ github.ref_name }}-

      - name: Verify data contracts
        run: python -m pytest -q

      - name: Rebuild all observed market-data caches
        run: python -u backtest/data_pipeline.py --rebuild-all

      - name: Upload rebuilt data
        uses: actions/upload-artifact@v4
        with:
          name: convertible-bond-real-data-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            backtest/cb_*_cache.csv
            backtest/cb_*_events.csv
            backtest/cb_basic_info.csv
            backtest/cb_clause_terms.csv
            backtest/rf_yield_cache.csv

      - name: Commit rebuilt caches to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backtest/cb_*_cache.csv \
            backtest/cb_*_events.csv \
            backtest/cb_basic_info.csv \
            backtest/cb_clause_terms.csv \
            backtest/rf_yield_cache.csv
          if git diff --cached --quiet; then
            echo "No rebuilt cache changes to commit."
          else
            git commit -m "data: rebuild observed market caches"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
